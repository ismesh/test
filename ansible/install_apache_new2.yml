---


- hosts: web_servers
  become: true
  tasks:

  - name: install apache2 and php for Ubuntu
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
      update_cache: yes
    when: ansible_distribution  == "Ubuntu"



- hosts: db_servers
  become: true
  tasks:

  - name: install mariadb for Ubuntu
    apt:
      name:
        - mariadb-server
      state: latest
      update_cache: yes
    when: ansible_distribution  == "Ubuntu"
