services:

  mongo7:
    image: mongo:7
    container_name: mongo7
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin

    volumes:
      - mongo-data:/data/db

  mongoexpress1:
    image: mongo-express
    container_name: mongoexpress1
    restart: unless-stopped

    depends_on:
      - mongo7

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin@mongo7:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass

volumes:
  mongo-data:
